
<div class="container mt-5">

  <div class="row justify-content-center">

    <div class="col-md-5">

      <div class="card shadow">

        <div class="card-header bg-dark text-white text-center">
          <h4>Sistema de Pleitos</h4>
          <p class="mb-0">Nathaly y Esdras</p>
        </div>

        <div class="card-body">

          <h5 class="text-center mb-4">
            Iniciar sesión
          </h5>

          <form (ngSubmit)="iniciarSesion()">

            <div class="form-group">
              <label>Correo electrónico</label>

              <input
                type="email"
                class="form-control"
                name="correo"
                [(ngModel)]="correo"
                placeholder="Ingrese su correo"
                required>
            </div>

            <div class="form-group">
              <label>Contraseña</label>

              <input
                type="password"
                class="form-control"
                name="password"
                [(ngModel)]="password"
                placeholder="Ingrese su contraseña"
                required>
            </div>

            <div class="alert alert-danger" *ngIf="mensaje">
              {{ mensaje }}
            </div>

            <button
              type="submit"
              class="btn btn-dark btn-block">
              Iniciar sesión
            </button>

          </form>

        </div>

        <div class="card-footer text-center">
          <small>Sistema de registro de conflictos</small>
        </div>

      </div>

    </div>

  </div>

</div>
